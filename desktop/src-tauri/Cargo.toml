[package]
name = "syncrese-desktop"
version = "0.1.0"
description = "Syncrèse desktop shell"
authors = ["Syncrese"]
edition = "2021"
rust-version = "1.77"

# main.rs is a thin wrapper so the same code can be reached by the mobile entry
# point and by the unit tests, which cannot link a binary crate.
[lib]
name = "syncrese_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
url = "2"
# The OS credential store — Windows Credential Manager, macOS Keychain, and
# Secret Service on Linux. The paired device id lives there rather than in a
# JSON file next to the binary, because a file is readable by every other
# process running as that user.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
# Tauri's own default; kept explicit so a future edit does not silently remove
# the custom-protocol feature and break release builds.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

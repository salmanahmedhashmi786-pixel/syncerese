[package]
name = "syncrese-desktop"
version = "0.1.0"
description = "Syncrèse desktop shell"
authors = ["Syncrese"]
edition = "2021"
rust-version = "1.77"

# main.rs is a thin wrapper so the same code can be reached by the unit tests,
# which cannot link a binary crate.
#
# No "cdylib" — that crate-type exists in Tauri's template for Android's JNI
# shared library, and this project never generated a mobile target (there is
# no gen/android or gen/apple; only gen/schemas, which is desktop-only
# capability validation). Windows' GNU linker enforces a hard limit on how
# many symbols a single DLL can export, and this dependency tree — Tauri, wry,
# tao and everything tauri-plugin-dialog pulls in — is well past it: adding
# the dialog plugin took the unused cdylib target from "wasteful" to
# "does not link" (`ld: export ordinal too large`). The staticlib and rlib
# outputs are unaffected; only a DLL has a PE export table to overflow.
[lib]
name = "syncrese_desktop_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Only for the "closing this disconnects your whole office" confirmation on a
# LAN host — see the on_window_event handler in open_instance. Rust-side only,
# never invoked from the webview, so it needs no capability entry.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
url = "2"
# The OS credential store — Windows Credential Manager, macOS Keychain, and
# Secret Service on Linux. The paired device id lives there rather than in a
# JSON file next to the binary, because a file is readable by every other
# process running as that user.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[features]
# Tauri's own default; kept explicit so a future edit does not silently remove
# the custom-protocol feature and break release builds.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
